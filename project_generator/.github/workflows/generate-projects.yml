name: "[PROJECTS] Generate Projects → Dispatch to test_githubActions (DEPRECATED)"
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Número de proyectos a generar'
        required: false
        default: '5'
        type: string
      nivel:
        description: 'Filtrar por nivel (junior/semisenior/senior)'
        required: false
        type: string
      scope:
        description: 'Filtrar por scope (miniproyecto/proyecto/multiproyecto)'
        required: false
        type: string
      lenguaje:
        description: 'Filtrar por lenguaje (python/javascript/typescript/csharp/go/rust)'
        required: false
        type: string
      ai_provider:
        description: 'Proveedor IA (openai/anthropic/gemini/deterministic)'
        required: false
        default: 'gemini'
        type: string

permissions:
  contents: read

jobs:
  deprecated:
    name: ⚠️ Este workflow está deprecado
    runs-on: ubuntu-latest
    steps:
      - name: Info
        run: |
          echo "⚠️ DEPRECADO: Este workflow ya no se usa."
          echo "El Project Generator ahora corre LOCALMENTE en test_githubActions via workflow 'Generate & Send Projects (local in test_githubActions)'"
          echo "Los secrets necesarios están en test_githubActions:"
          echo "  - TELEGRAM_BOT_TOKEN"
          echo "  - TELEGRAM_REPORTS_PROYECTOS_CHANNEL_ID"
          echo "  - GEMINI_API_KEY (o OPENAI_API_KEY / ANTHROPIC_API_KEY)"
          echo "  - GH_PAT (para commit history)"
          exit 0