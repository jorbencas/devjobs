services:
  #          ============================================================
  #          CLI interactivo (descargar/clonar/gestionar canales/temas)
  #          ============================================================
  telegram:
    build: .
    container_name: telegram-downloader
    volumes:
      - ./config/config.bin:/app/config/config.bin
      - ./config/secret.key:/app/config/secret.key
      - ./config/grupos.json:/app/config/grupos.json
      - ./config/enviados.json:/app/config/enviados.json
      - ./sessions/tg_menu.session:/app/sessions/tg_menu.session
      - ./Descargas_Telegram:/app/Descargas_Telegram
      - ../data/comprimidos:/comprimidos
    environment:
      - TG_TOOLBOX_SESION=/app/sessions/tg_menu.session
    stdin_open: true
    tty: true
    command: tail -f /dev/null

  #          ============================================================
  #          Daemon uploader (sube *_compressed.mp4 a los grupos/foros)
  #          ============================================================
  uploader:
    build: .
    container_name: telegram-uploader
    restart: unless-stopped
    volumes:
      - ./config/config.bin:/app/config/config.bin
      - ./config/secret.key:/app/config/secret.key
      - ./config/grupos.json:/app/config/grupos.json
      - ./config/enviados.json:/app/config/enviados.json
      - ./sessions/tg_toolbox.session:/app/sessions/tg_toolbox.session
      - ./sessions/uploader.session:/app/sessions/uploader.session
      - ../data/partes:/app/partes
      - ../data/comprimidos:/comprimidos
    environment:
      UPLOADER_INTERVALO: "60"
      # Reenvío automático al canal de solo-reenvío (diarios de la boticaria)
      UPLOADER_FORWARD_CHANNEL: "-1004359591062"
      UPLOADER_FORWARD_KEYWORD: "diarios_boticaria"
    command: python -u /app/app/subir_videos.py /comprimidos