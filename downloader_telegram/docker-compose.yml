services:
  telegram:
    build: .
    container_name: telegram-downloader
    volumes:
      - ./config.bin:/app/config.bin
      - ./secret.key:/app/secret.key
      - ./ultimate_session.session:/app/ultimate_session.session
      - ./Descargas_Telegram:/app/Descargas_Telegram
    stdin_open: true
    tty: true

  uploader:
    build: .
    container_name: telegram-uploader
    restart: unless-stopped
    volumes:
      - ./config.bin:/app/config.bin
      - ./secret.key:/app/secret.key
      - ./uploader.session:/app/uploader.session
      - ./grupos.json:/app/grupos.json
      - ./enviados.json:/app/enviados.json
      - ../data/partes:/app/partes
      - /home/jorge/dev/devjobs/data/comprimidos:/comprimidos
    environment:
      # Opcional: cambiar credenciales SIN tocar config.bin
      # UPLOADER_API_ID:
      # UPLOADER_API_HASH:
      # Intervalo entre pasadas (segundos)
      UPLOADER_INTERVALO: "60"
      # Reenvío automático al canal de solo-reenvío (diarios de la boticaria)
      # UPLOADER_FORWARD_CHANNEL: "-1004359591062"   # canal "Los diarios de la boticaria sendo"
      # UPLOADER_FORWARD_KEYWORD: "diarios_boticaria" # keyword que dispara el reenvío
    command: python -u /app/subir_videos.py /comprimidos
