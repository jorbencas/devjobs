services:
  downloader:
    image: alpine:latest
    container_name: yt_ffmpeg_downloader
    volumes:
      - ./test_video:/test_video
    working_dir: /test_video
    user: root
    tty: true
    stdin_open: true
    command: >-
      sh -c "apk update && apk add --no-cache ffmpeg bash su-exec python3 py3-pip &&
      pip install --break-system-packages yt-dlp &&
      id -u jorge >/dev/null 2>&1 || adduser -D -u 1000 jorge &&
      chown -R jorge:jorge /test_video &&
      su-exec jorge bash midu.sh"
