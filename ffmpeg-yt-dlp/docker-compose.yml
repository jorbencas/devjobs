services:
  downloader:
    image: alpine:latest
    container_name: yt_ffmpeg_downloader
    volumes:
      - ./:/app
    working_dir: /app/test_video
    user: root
    tty: true
    stdin_open: true
    command: >-
      sh -c "apk update && apk add --no-cache ffmpeg bash su-exec python3 py3-pip jq &&
      pip install --break-system-packages yt-dlp &&
      id -u jorge >/dev/null 2>&1 || adduser -D -u 1000 jorge &&
      chown -R jorge:jorge /app/test_video &&
      su-exec jorge bash midu.sh"

  monitor:
    image: alpine:latest
    container_name: ffmpeg_monitor
    restart: unless-stopped
    user: root
    command: >-
      sh -c "apk add --no-cache ffmpeg bash findutils python3 tesseract-ocr tesseract-ocr-data-eng &&
      mkdir -p /watch /comprimidos &&
      bash /app/scripts/monitor_folder.sh --completed-only -r 720 --codec libx265 -c 28 -p fast /watch"
    volumes:
      - ./:/app
      - /home/jorge/dev/devjobs/test_videos/test:/watch
      - /home/jorge/dev/devjobs/Videos/comprimidos:/comprimidos
    environment:
      - OUTPUT_DIR=/comprimidos
      - POLL_INTERVAL=30
