services:
  hdfull_downloader:
    build: .
    image: hdfull-downloader:latest
    container_name: hdfull-downloader
    ports:
      - "6080:6080"
      - "5900:5900"
      - "9312:9312"
    volumes:
      - .:/app
      - profile:/profile
    environment:
      - HDFULL_USER=${HDFULL_USER}
      - HDFULL_PASS=${HDFULL_PASS}
      - TZ=Europe/Madrid
    stdin_open: true
    tty: true

volumes:
  profile:
