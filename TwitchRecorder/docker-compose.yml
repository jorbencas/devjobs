services:
  twitchrecorder:
    build: .
    container_name: twitchrecorder
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json:ro
      - /home/jorge/dev/devjobs/data/grabaciones:/recordings
    environment:
      - TZ=Europe/Madrid

  run:
    build: .
    volumes:
      - ./config.json:/app/config.json:ro
      - /home/jorge/dev/devjobs/data/grabaciones:/recordings
    environment:
      - TZ=Europe/Madrid
    stdin_open: true
    tty: true
