name: "[PROJECTS] Generate Projects (Internal)"

on:
  workflow_call:
    inputs:
      count:
        description: "Number of projects to generate"
        required: false
        default: "5"
        type: string
      nivel:
        description: "Filter by level (junior/semisenior/senior)"
        required: false
        type: string
      scope:
        description: "Filter by scope (miniproyecto/proyecto/multiproyecto)"
        required: false
        type: string
      lenguaje:
        description: "Filter by language (python/javascript/typescript/csharp/go/rust)"
        required: false
        type: string
      ai_provider:
        description: "AI provider (openai/anthropic/gemini/deterministic)"
        required: false
        default: "gemini"
        type: string

    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_REPORTS_PROYECTOS_CHANNEL_ID:
        required: true
      GEMINI_API_KEY:
        required: true
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: write  # para committear historial

jobs:
  generate_and_send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: project_generator

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_REPORTS_PROYECTOS_CHANNEL_ID: ${{ secrets.TELEGRAM_REPORTS_PROYECTOS_CHANNEL_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER: ${{ inputs.ai_provider }}
      AI_MODEL: ${{ vars.AI_MODEL || 'gemini-1.5-flash' }}
      PROJECTS_PER_RUN: ${{ inputs.count }}
      SCRAPE_TUWEB_DEV: ${{ vars.SCRAPE_TUWEB_DEV || 'true' }}
      DATA_DIR: ./data

    steps:
      - name: Checkout devjobs
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: project_generator/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r project_generator/requirements.txt

      - name: Create data directory
        run: mkdir -p project_generator/data

      - name: Generate projects
        id: generate
        run: |
          cd project_generator
          ARGS=()
          COUNT="${{ inputs.count }}"
          if [[ -n "${{ inputs.nivel }}" ]]; then
            ARGS+=(--nivel "${{ inputs.nivel }}")
          fi
          if [[ -n "${{ inputs.scope }}" ]]; then
            ARGS+=(--scope "${{ inputs.scope }}")
          fi
          if [[ -n "${{ inputs.lenguaje }}" ]]; then
            ARGS+=(--lenguaje "${{ inputs.lenguaje }}")
          fi
          python -m src.main generate --count "$COUNT" "${ARGS[@]}" --send-telegram
        env:
          PYTHONPATH: project_generator/src
          AI_PROVIDER: ${{ inputs.ai_provider }}

      - name: Upload history artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-history
          path: project_generator/data/generated_projects.json
          retention-days: 90

      - name: Commit history if changed
        run: |
          cd project_generator
          if git diff --quiet data/generated_projects.json; then
            echo "No changes in history"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/generated_projects.json
            git commit -m "chore: update project history [skip ci]"
            git push origin master
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}